# Copy this file to config.toml and edit it. config.toml is not tracked by git.

# Moonraker address: IP or hostname as you open Mainsail/Fluidd in the browser.
# Add the port if Moonraker is not behind the web server, e.g. "192.168.1.50:7125".
printer_host = "192.168.1.50"

# Port of the phone status page (http://<this computer>:<port>). 0 turns it off.
# web_port = 8080

# What the twin does when it is sure a fault is happening (missing power for 150 s while printing):
# "shadow" only logs "would pause" to ariza_raporlari.txt, "active" pauses the print, "off" does nothing.
# Without this line: "active". A new printer should start in "shadow"; after 24 print hours over 12 prints the twin
# says so on start-up and on the phone page, review the reports and switch to "active" if they were all real faults.
# (The older Turkish values "golge" / "aktif" / "kapali" still work.)
# pause_mode = "shadow"

# The twin's folder on the Raspberry Pi as this PC sees it (the Samba share of pi/install.sh); used by
# sync_pi_logs.py to copy finished logs here. Forward slashes work on Windows too.
# pi_share = "//192.168.1.60/ender3-twin"

# Klipper object names, only if yours differ from the stock ones (see printer.cfg section headers):
# a part fan defined as [fan_generic part_fan], a hotend that is not [extruder], or no heated bed (bed = "").
# [klipper]
# hotend = "extruder"
# part_fan = "fan_generic part_fan"
# bed = "heater_bed"
