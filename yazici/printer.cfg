[include mainsail.cfg]

[exclude_object]

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC2
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB3
dir_pin: PB2
enable_pin: !PA5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
#position_endstop: 0.0
position_min: -4
position_max: 250

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
pressure_advance: 0.040
min_extrude_temp: 170
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA6
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PB4

[mcu]
serial: /dev/ttyUSB0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

[display]
lcd_type: st7920
cs_pin: PA3
sclk_pin: PA1
sid_pin: PC1
encoder_pins: ^PD2, ^PD3
click_pin: ^!PC0

# --- GELİŞMİŞ MAKROLAR ---

[gcode_macro START_GCODE]
description: Standart Temiz Baskı Başlangıcı
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M140 S{BED_TEMP}
    M104 S150

    G90
    G28

    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    # ----- PRIME LINE (Süpürme Çizgisi) -----
    G1 Z0.28 F3000
    G1 X0.1 Y20 Z0.28 F5000
    M82
    G92 E0
    G1 X0.1 Y180 Z0.28 F1500 E14
    G1 X0.4 Y180 Z0.28 F5000
    G1 X0.4 Y20 Z0.28 F1500 E28

    # ----- TEMİZ AYRILMA -----
    G92 E0
    G1 E-0.8 F1800
    G1 Z1 F3000
    G1 X10 F9000
    G92 E0

[gcode_macro END_PRINT]
description: Baskı bitişi ve güvenli park
gcode:
    G91

    G1 E-5 F300
    G1 Z10 F600

    G90
    G1 X0 Y220 F1200

    TURN_OFF_HEATERS
    M84

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    G91

    G1 E-5 F300
    G1 Z10 F600

    G90
    G1 X0 Y220 F1200

    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro T0]
gcode:
    G92 E0

[gcode_macro _CLIENT_VARIABLE]
# Mainsail PAUSE park noktasi: varsayilan X230 Y230'da araba govdeye carpip adim kaciriyordu (20.10,
# devamda baski sola kayiyordu). END_PRINT'in sorunsuz park noktasi kullaniliyor.
variable_use_custom_pos   : True
variable_custom_park_x    : 0.0
variable_custom_park_y    : 220.0
variable_custom_park_dz   : 2.0
gcode:

#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
